<ion-content [fullscreen]="true" class="dark-bg">
  <div class="roulette-container">
    
    <div class="roulette-header">
      <h2>
        <ion-icon name="aperture" style="color: #FFD700; margin-right: 8px;"></ion-icon>
        Task Roulette
      </h2>
      <p>Gira la ruleta y deja que el destino elija</p>
    </div>

    <div class="wheel-wrapper">
      <div class="pointer"></div>
      
      <!-- La Ruleta que gira -->
      <div class="wheel" 
           [style.background]="ruletaGradient"
           [style.transform]="'rotate(-' + angulo + 'deg)'">

        <div class="wheel-segment" 
             *ngFor="let tarea of tareas; let i = index"
             [style.transform]="'rotate(' + ((i * (360 / tareas.length)) + (180 / tareas.length) - 90) + 'deg)'">
          <span class="segment-text">{{ tarea }}</span>
        </div>

      </div>
    </div>

    <ion-button 
      class="neon-btn-gold" 
      expand="block" 
      (click)="girarRuleta()" 
      [disabled]="girando || tareas.length === 0">

      <ion-icon [name]="girando ? 'sync' : 'aperture'" slot="start" [class.spin-anim]="girando"></ion-icon>
      {{ girando ? 'GIRANDO...' : 'GIRAR RULETA' }}
      
    </ion-button>

  </div>
</ion-content>
